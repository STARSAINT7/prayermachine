<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAYER MACHINE BY: EANG.THANKGOD OKODUWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Imported Orbitron for strong distinct developer branding */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .heading-font { font-family: 'Cinzel', serif; }
        .developer-font { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Developer Fire Blinking & Glowing Effect */
        .developer-fire-badge {
            background: linear-gradient(90deg, #ff0000, #ff7300, #ffeb00, #ff0000);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
            animation: fireGlow 1.8s infinite alternate, fireGradient 3.5s ease infinite;
        }

        @keyframes fireGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fireGlow {
            0% { filter: drop-shadow(0 0 3px #ff4500) drop-shadow(0 0 8px #ff0000); }
            100% { filter: drop-shadow(0 0 8px #ffae00) drop-shadow(0 0 18px #ff4500); }
        }
    </style>
</head>

        let activePrayersList = [];
        let currentCategoryIndex = 0;
        let currentPrayerIndex = 0;
        let synth = window.speechSynthesis;

        // Dynamic Elements
        const categoryTabs = document.getElementById('category-tabs');
        const categoryTitle = document.getElementById('category-title');
        const scriptureRef = document.getElementById('scripture-ref');
        const scriptureText = document.getElementById('scripture-text');
        const prayerNumber = document.getElementById('prayer-number');
        const prayerText = document.getElementById('prayer-text');
        const prayerCounter = document.getElementById('prayer-counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const audioIcon = document.getElementById('audio-icon');
        const audioText = document.getElementById('audio-text');

        // Fisher-Yates Array Reshuffle Function
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Application Startup
        function initApp() {
            renderTabs();
            loadCategory(0);
        }

        // Render Tabs Bar
        function renderTabs() {
            categoryTabs.innerHTML = '';
            categoriesData.forEach((cat, index) => {
                const button = document.createElement('button');
                button.className = `px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap border ${
                    index === currentCategoryIndex 
                    ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 border-amber-400 font-bold shadow-md shadow-amber-500/20' 
                    : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800 hover:text-slate-200'
                }`;
                button.innerText = cat.name;
                button.onclick = () => selectCategory(index);
                categoryTabs.appendChild(button);
            });
        }

        function selectCategory(index) {
            stopAudio();
            currentCategoryIndex = index;
            currentPrayerIndex = 0;
            renderTabs();
            loadCategory(currentCategoryIndex);
        }

        function loadCategory(catIndex) {
            const cat = categoriesData[catIndex];
            
            // Reshuffle prayers array for fresh session start
            activePrayersList = shuffleArray(cat.prayers);
            
            categoryTitle.innerText = cat.name.toUpperCase();
            scriptureRef.innerText = cat.verseRef;
            scriptureText.innerText = cat.verseText;
            updatePrayerDisplay();
        }

        function updatePrayerDisplay() {
            stopAudio();
            prayerNumber.innerText = `PRAYER #${currentPrayerIndex + 1}`;
            prayerText.innerText = activePrayersList[currentPrayerIndex];
            prayerCounter.innerText = `${currentPrayerIndex + 1} / 21`;

            prevBtn.disabled = currentPrayerIndex === 0;
            nextBtn.disabled = currentPrayerIndex === activePrayersList.length - 1;
        }

        function navigate(direction) {
            const newIndex = currentPrayerIndex + direction;

            if (newIndex >= 0 && newIndex < activePrayersList.length) {
                currentPrayerIndex = newIndex;
                updatePrayerDisplay();
            }
        }

        // Audio Controls
        function toggleAudio() {
            if (isSpeaking) {
                stopAudio();
            } else {
                speakPrayer();
            }
        }

        function speakPrayer() {
            if ('speechSynthesis' in window) {
                synth.cancel();
                const textToSpeak = prayerText.innerText;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                
                utterance.rate = 0.9;
                utterance.pitch = 1.0;

                utterance.onstart = () => {
                    isSpeaking = true;
                    audioIcon.className = "fa-solid fa-square text-red-950";
                    audioText.innerText = "Stop";
                };

                utterance.onend = () => { resetAudioUI(); };
                utterance.onerror = () => { resetAudioUI(); };

                synth.speak(utterance);
            } else {
                alert("Text-to-speech is not supported on this device/browser.");
            }
        }

        function stopAudio() {
            if ('speechSynthesis' in window) {
                synth.cancel();
            }
            resetAudioUI();
        }

        function resetAudioUI() {
            isSpeaking = false;
            audioIcon.className = "fa-solid fa-volume-high";
            audioText.innerText = "Listen";
        }

        window.onload = initApp;
    </script>
</body>
