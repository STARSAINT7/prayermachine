.sub{color:var(--muted);font-size:.85rem;margin-top:.2rem}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.5rem .1rem .8rem;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
@media(min-width:720px){.chips{flex-wrap:wrap;justify-content:center;overflow:visible}}
.chip{flex:none;scroll-snap-align:center;display:flex;align-items:center;gap:.45rem;cursor:pointer;font:600 .82rem 'Familjen Grotesk';
  color:var(--ink);background:#ffffffb0;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;transition:.2s}
.chip i{width:.7rem;height:.7rem;border-radius:50%;background:hsl(var(--c) 60% 38%)}
.chip:hover{background:#fff}
.chip[aria-pressed=true]{background:hsl(var(--c) 58% 26%);border-color:transparent;color:#fff}
.chip[aria-pressed=true] i{background:hsl(var(--c) 80% 78%)}

#vref{font-weight:700;font-size:.85rem;color:var(--muted)}
.panel{margin-top:1rem;background:var(--deep);color:#f4f1e8;border-radius:18px;overflow:hidden;transition:background .5s}
.bar{height:5px;background:#ffffff22}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e3b84a,#fff1c2);transition:width .35s}
.body{padding:1.6rem clamp(1.2rem,5vw,2.4rem) 1.2rem}
#pnum{font-weight:600;font-size:.85rem;color:#e3b84a}
#ptext{font:400 clamp(1.5rem,5vw,2.1rem)/1.45 'Newsreader',serif;margin-top:.6rem;min-height:9.5rem;transition:opacity .25s,transform .25s}
#ptext.swap{opacity:0;transform:translateY(8px)}
.ctrl{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:0 clamp(1.2rem,5vw,2.4rem) 1.4rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font:700 .92rem 'Familjen Grotesk';cursor:pointer;border-radius:12px;padding:.7rem 1.1rem;

.btn.gold{background:#e3b84a;border-color:#e3b84a;color:#241a05}
.btn.gold:hover:not(:disabled){background:#f1cb6a}
.sp{margin-left:auto;display:flex;gap:.6rem}
footer{margin-top:auto;text-align:center;padding:1.6rem 0 1.2rem;font-size:.78rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="wrap">

  <p class="sub" id="sub"></p>
</header>

<main class="wrap">

    <p id="vtext"></p>
    <div id="vref"></div>
  </section>

    <div class="bar"><i id="fill"></i></div>
    <div class="body">
      <div id="pnum"></div>
      <p id="ptext"></p>
    </div>
    <div class="ctrl">
      <button class="btn gold" id="listen" onclick="toggleAudio()"><span id="lt">Listen</span></button>
      <button class="btn" onclick="reshuffle()" title="Shuffle the order of prayers">Shuffle</button>
      <div class="sp">
        <button class="btn" id="prev" onclick="navigate(-1)">Previous</button>
        <button class="btn" id="next" onclick="navigate(1)">Next</button>
      </div>
    </div>
  </section>
</main>

let list = [], ci = 0, pi = 0, speaking = false;
const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);
const hue = i => (i * 360 / categoriesData.length + 205) % 360;
const clean = n => n.replace(/^\d+\.\s*/, '');

function shuffle(a){const s=[...a];for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]];}return s;}

function renderChips(){
  $('chips').innerHTML = '';
  categoriesData.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.style.setProperty('--c', hue(i));
    b.setAttribute('aria-pressed', i===ci);
    b.innerHTML = '<i></i>' + clean(c.name);
    b.onclick = () => selectCategory(i);
    $('chips').appendChild(b);
    if(i===ci) b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  });
}

function selectCategory(i){
  stopAudio(); ci = i; pi = 0;
  document.documentElement.style.setProperty('--h', Math.round(hue(i)));
  const c = categoriesData[i];
  list = shuffle(c.prayers);
  $('gname').textContent = 'Prayers for ' + clean(c.name).toLowerCase();
  $('vtext').textContent = '\u201C' + c.verseText + '\u201D';
  $('vref').textContent = c.verseRef;
  renderChips(); show(false);
}

function show(animate=true){
  stopAudio();
  const apply = () => {
    $('pnum').textContent = `Prayer ${pi+1} of ${list.length}`;
    $('ptext').textContent = list[pi];
    $('fill').style.width = ((pi+1)/list.length*100) + '%';
    $('prev').disabled = pi===0 && ci===0;
    $('next').textContent = pi===list.length-1 ? (ci<categoriesData.length-1 ? 'Next group' : 'Finish') : 'Next';
    $('next').disabled = pi===list.length-1 && ci===categoriesData.length-1;
    $('ptext').classList.remove('swap');
  };
  if(animate){ $('ptext').classList.add('swap'); setTimeout(apply,180); } else apply();
}

function navigate(d){
  const n = pi + d;
  if(n >= list.length){ if(ci < categoriesData.length-1) selectCategory(ci+1); return; }
  if(n < 0){ if(ci > 0){ selectCategory(ci-1); pi = list.length-1; show(false); } return; }
  pi = n; show();
}

function reshuffle(){ list = shuffle(categoriesData[ci].prayers); pi = 0; show(); }

function toggleAudio(){ speaking ? stopAudio() : speak(); }
function speak(){
  if(!('speechSynthesis' in window)){ alert('Text-to-speech is not supported on this device or browser.'); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance($('ptext').textContent);
  u.rate = .9;
  u.onstart = () => { speaking = true; $('lt').textContent = 'Stop'; };
  u.onend = u.onerror = resetAudio;
  synth.speak(u);
}
function stopAudio(){ if('speechSynthesis' in window) synth.cancel(); resetAudio(); }
function resetAudio(){ speaking = false; $('lt').textContent = 'Listen'; }

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') navigate(1);
  if(e.key==='ArrowLeft') navigate(-1);
});

$('sub').textContent = `${categoriesData.length} prayer groups, each with its own scripture (KJV)`;
selectCategory(0);
</script>
